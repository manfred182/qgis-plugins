<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Hoja / Símbolo de la Amazonía (Fondo Transparente) -->
  <path d="M 15 85 C 15 35, 55 15, 85 15 C 85 65, 55 85, 15 85 Z" fill="#2D6A4F" stroke="#1B4332" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Nervadura de la hoja para mayor detalle -->
  <path d="M 15 85 C 35 65, 60 40, 85 15" fill="none" stroke="#1B4332" stroke-width="3" stroke-linecap="round" />
  <path d="M 50 50 L 35 30" fill="none" stroke="#1B4332" stroke-width="3" stroke-linecap="round" />
  <path d="M 65 65 L 80 45" fill="none" stroke="#1B4332" stroke-width="3" stroke-linecap="round" />

  <!-- Red vectorial (Líneas y Nodos con borde para contraste) -->
  <polyline points="25,65 45,35 75,50" fill="none" stroke="#F2DD00" stroke-width="4" stroke-linejoin="round" />
  <circle cx="25" cy="65" r="6" fill="#74C69D" stroke="#1B4332" stroke-width="2"/>
  <circle cx="45" cy="35" r="6" fill="#74C69D" stroke="#1B4332" stroke-width="2"/>
  <circle cx="75" cy="50" r="6" fill="#74C69D" stroke="#1B4332" stroke-width="2"/>
  
  <!-- Símbolo de Excel / Tabla (Flotante) -->
  <rect x="50" y="60" width="35" height="30" rx="4" fill="#107C41" stroke="#FFFFFF" stroke-width="2" />
  <line x1="50" y1="70" x2="85" y2="70" stroke="#FFFFFF" stroke-width="2" />
  <line x1="50" y1="80" x2="85" y2="80" stroke="#FFFFFF" stroke-width="2" />
  <line x1="62" y1="60" x2="62" y2="90" stroke="#FFFFFF" stroke-width="2" />
  <line x1="74" y1="60" x2="74" y2="90" stroke="#FFFFFF" stroke-width="2" />
</svg>
