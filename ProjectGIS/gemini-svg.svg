<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo redondeado estilo icono de QGIS -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="#1B4332" />
  
  <!-- Hoja / Símbolo de la Amazonía -->
  <path d="M 20 80 C 20 40, 50 20, 80 20 C 80 60, 50 80, 20 80 Z" fill="#2D6A4F" stroke="#40916C" stroke-width="3" />
  
  <!-- Red vectorial (Nodos y líneas) -->
  <polyline points="30,60 50,40 70,55" fill="none" stroke="#F2DD00" stroke-width="4" stroke-linejoin="round" />
  <circle cx="30" cy="60" r="5" fill="#74C69D" />
  <circle cx="50" cy="40" r="5" fill="#74C69D" />
  <circle cx="70" cy="55" r="5" fill="#74C69D" />
  
  <!-- Símbolo de Excel / Tabla -->
  <rect x="55" y="60" width="30" height="25" rx="3" fill="#107C41" />
  <line x1="55" y1="68" x2="85" y2="68" stroke="#FFFFFF" stroke-width="2" />
  <line x1="55" y1="76" x2="85" y2="76" stroke="#FFFFFF" stroke-width="2" />
  <line x1="65" y1="60" x2="65" y2="85" stroke="#FFFFFF" stroke-width="2" />
  <line x1="75" y1="60" x2="75" y2="85" stroke="#FFFFFF" stroke-width="2" />
</svg>
